# Salumée V4 — sito statico con tre pagine e sequenza Mortadella.
# Pubblica solo ciò che serve alla pagina (niente sorgenti, prove o documenti).
[build]
  command = "rm -rf _site && mkdir -p _site/assets && cp index.html macelleria.html paninoteca.html robots.txt favicon.ico _site/ && cp -R css js _site/ && cp -R assets/fonts assets/img assets/seq _site/assets/"
  publish = "_site"

# Demo non indicizzata dai motori di ricerca
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
